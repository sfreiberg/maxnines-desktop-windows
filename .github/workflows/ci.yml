# Tests, and a build of the app, on every pull request and on main. A commit on a
# branch with a pull request runs once, for the pull request, and a newer push
# cancels the run for the one before it. The Arm64 build and the installers, with
# their install and upgrade checks, wait for a version tag (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared code has nothing from Windows, so its tests run on Linux, which is
  # quicker and cheaper.
  kit:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/MaxNinesKit.Tests

  # The app itself only builds on Windows, so this is the one Windows job.
  windows:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet publish src/MaxNinesTray -c Release -r win-x64 -p:Platform=x64 -o out
      # Settings shows which commit it was built from, so make sure it was recorded.
      - name: Check the build is recorded
        shell: pwsh
        run: |
          $dll = [IO.File]::ReadAllText("out/MaxNines.dll", [Text.Encoding]::Latin1)
          if (-not $dll.Contains("$env:GITHUB_SHA")) { throw "The commit wasn't recorded" }
          if ($dll.Contains("$env:GITHUB_SHA-dirty")) { throw "The checkout counted as changed" }
