name: CI

on:
  push:
  pull_request:

jobs:
  # The shared code has nothing from Windows, so its tests run on Linux too, which is
  # quicker and cheaper.
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/MaxNinesKit.Tests

  # The app itself only builds on Windows.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'x64') { 'win-x64' } else { 'win-arm64' }
          dotnet publish src/MaxNinesTray -c Release -r $rid -p:Platform=${{ matrix.platform }} -o out
      # Settings shows which commit it was built from, so make sure it was recorded.
      - name: Check the build is recorded
        shell: pwsh
        run: |
          $dll = [IO.File]::ReadAllText("out/MaxNines.dll", [Text.Encoding]::Latin1)
          if (-not $dll.Contains("$env:GITHUB_SHA")) { throw "The commit wasn't recorded" }
          if ($dll.Contains("$env:GITHUB_SHA-dirty")) { throw "The checkout counted as changed" }
      - if: matrix.platform == 'x64'
        run: dotnet test --project tests/MaxNinesKit.Tests
      - uses: actions/upload-artifact@v4
        with:
          name: maxnines-desktop-${{ matrix.platform }}
          path: out
          retention-days: 14
